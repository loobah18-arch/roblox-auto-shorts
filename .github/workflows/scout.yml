name: Campaign Scout

on:
  schedule:
    # Daily 7:12 AM UTC — off the :00/:30 marks
    - cron: '12 7 * * *'
  workflow_dispatch:
    inputs:
      min_rate:
        description: 'Minimum $/1K floor'
        required: false
        default: '1.00'
        type: string
      min_remaining:
        description: 'Minimum remaining budget ($)'
        required: false
        default: '1000'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run scout (fetch → filter → model score)
        env:
          # Reads the SAME key you use locally — stored once as a GitHub Secret,
          # never committed to the repo.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Reuse whatever model you already use elsewhere, or leave default.
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          python3 scripts/shortlist_campaigns.py \
            --min-rate "${{ inputs.min_rate || '1.00' }}" \
            --min-remaining "${{ inputs.min_remaining || '1000' }}" \
            --platform youtube \
            --output shortlist.md

      - name: Upload shortlist artifact
        uses: actions/upload-artifact@v4
        with:
          name: campaign-shortlist
          path: shortlist.md

      - name: Post shortlist as issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('shortlist.md') ? fs.readFileSync('shortlist.md', 'utf8') : 'Scout produced no shortlist (filter too strict or fetch failed).';
            const date = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 Campaign Shortlist — ${date}`,
              body: body + `\n\n---\n🤖 Generated by the Campaign Scout workflow. Review, then join manually per the 6-point filter.`,
              labels: ['scout']
            });
