name: Generate Roblox Short

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-liberation \
            fonts-noto \
            fonts-noto-color-emoji \
            libmagic1 || sudo apt-get install -y libmagic1t64

      - name: Configure ImageMagick
        run: |
          sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's#rights="none" pattern="PDF"#rights="read|write" pattern="PDF"#g' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="memory" value="256MiB"/name="memory" value="2GiB"/' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="disk" value="1GiB"/name="disk" value="8GiB"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLIENT_ID:        ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:    ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN:    ${{ secrets.REFRESH_TOKEN }}
        run: python -u main.py

      - name: Clean Temp Files
        if: always()
        run: |
          rm -f scene_*.mp3 final_short.mp4
          rm -rf motion_templates/

      - name: Commit Story State
        run: |
          git config --global user.name "Story Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add game_state.json story_memory_*.txt character_bible_*.json
          git diff --cached --quiet || git commit -m "🤖 Auto-update story state [skip ci]"
          git push
