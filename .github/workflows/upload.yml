name: Generate Automated Roblox Short

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every day at 12:30 PM UTC (6:00 PM IST)
    - cron: '30 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Rembg u2net Model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model-v1
          restore-keys: |
            u2net-model-

      - name: Install System Dependencies (ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Modify ImageMagick Security Policy for MoviePy
        run: |
          sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roblox_Short
          path: final_short.mp4
          retention-days: 5

      - name: Modify ImageMagick Security Policy for MoviePy
        # Reliably deletes the line blocking TextClip rendering
        run: |
          sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Add your YouTube token secrets here when ready for upload automation
        run: python main.py

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roblox_Short
          path: final_short.mp4
          retention-days: 5
