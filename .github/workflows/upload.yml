name: Generate Automated Roblox Short

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every day at 12:30 PM UTC (6:00 PM IST)
    - cron: '30 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Grants permission for the workflow to write/push changes back to the repository
    permissions:
      contents: write

    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Rembg u2net Model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model-v1
          restore-keys: |
            u2net-model-

      - name: Install System Dependencies (ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Modify ImageMagick Security Policy for MoviePy
        run: |
          sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python main.py

      - name: Commit and Push Story Memory
        run: |
          git config --global user.name "Story Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add story_memory.txt
          git commit -m "Auto-update infinite story memory for next episode" || exit 0
          git push
