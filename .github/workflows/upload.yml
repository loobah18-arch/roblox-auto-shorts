name: Generate Automated Roblox Short

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every day at 12:30 PM UTC
    - cron: '30 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    # FIX 1: Increased timeout. Viggle API queues and MoviePy rendering can easily exceed 15 minutes.
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # FIX 2: Added fonts-liberation. Without it, MoviePy's TextClip will crash or render squares on Ubuntu.
      - name: Install System Dependencies (FFmpeg, ImageMagick & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation

      # FIX 3: Increased ImageMagick memory/disk limits to prevent "cache resources exhausted" errors during video assembly.
      - name: Modify ImageMagick Security Policy for MoviePy
        run: |
          sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="memory" value="256MiB"/name="memory" value="2GiB"/' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="disk" value="1GiB"/name="disk" value="4GiB"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY_2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY_3 }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python main.py

      # FIX 4: Uploads the video as an artifact so you can manually download it if the YouTube API upload fails.
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: Final-Roblox-Short
          path: final_short.mp4
          retention-days: 3

      # FIX 5: Safer git commit logic. Prevents workflow from throwing a red 'failed' badge if the story memory didn't change.
      - name: Commit and Push Story Memory
        run: |
          git config --global user.name "Story Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add story_memory.txt
          git commit -m "Auto-update infinite story memory for next episode" || echo "No changes to commit"
          git push
