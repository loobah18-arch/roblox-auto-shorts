name: build-and-upload

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required to allow GitHub Actions to push the story_memory.txt file back to the repo
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      - name: Patch ImageMagick Security Policy
        run: |
          # Finds the policy file and deletes the line blocking text rendering (@*)
          find /etc/ImageMagick-* -name "policy.xml" -exec sudo sed -i '/pattern="@\*"/d' {} \;

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Save Story Memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # We check if the file exists to prevent errors if Brookhaven was chosen (since no file is created)
          if [ -f story_memory.txt ]; then
            git add story_memory.txt
            git commit -m "Update Blox Fruits story memory" || echo "No changes to commit"
            git push
          else
            echo "No story_memory.txt found. Skipping commit."
          fi
