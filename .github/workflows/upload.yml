name: Generate Roblox Short

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-liberation \
            fonts-noto \
            fonts-noto-color-emoji \
            libmagic1

      - name: Configure ImageMagick
        run: |
          sudo sed -i '/pattern="@\*"/d'                                /etc/ImageMagick-6/policy.xml
          sudo sed -i 's|rights="none" pattern="PDF"|rights="read|write" pattern="PDF"|g' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="memory" value="256MiB"/name="memory" value="2GiB"/'       /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="disk" value="1GiB"/name="disk" value="8GiB"/'             /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          CLIENT_ID:       ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:   ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN:   ${{ secrets.REFRESH_TOKEN }}
          FAL_API_KEY:     ${{ secrets.FAL_API_KEY }}
          FAL_API_KEY_1:   ${{ secrets.FAL_API_KEY_1 }}
          FAL_API_KEY_2:   ${{ secrets.FAL_API_KEY_2 }}
          FAL_API_KEY_3:   ${{ secrets.FAL_API_KEY_3 }}
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          HF_TOKEN_1:      ${{ secrets.HF_TOKEN_1 }}
          HF_TOKEN_2:      ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3:      ${{ secrets.HF_TOKEN_3 }}
        run: python main.py

      - name: Clean Temp Files
        if: always()
        run: |
          rm -f scene_*.mp3 final_short.mp4
          rm -rf motion_templates/

      - name: Commit Story Memory
        run: |
          git config --global user.name  "Story Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add story_memory.txt character_bible.json
          git diff --cached --quiet || git commit -m "🤖 Auto-update story memory [skip ci]"
          git push
