name: build-and-upload

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required to allow GitHub Actions to push files back to the repo
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      - name: Patch ImageMagick Security Policy
        run: |
          # Finds the policy file and deletes the line blocking text rendering (@*)
          find /etc/ImageMagick-* -name "policy.xml" -exec sudo sed -i '/pattern="@\*"/d' {} \;

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Commit and Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Use a wildcard to catch ANY generated story memory file, and include game_state.json
          git add game_state.json story_memory_*.txt
          
          # Add [skip ci] to prevent this commit from triggering a duplicate workflow run
          git commit -m "chore: update game state and story memory [skip ci]" || echo "No changes to commit"
          git push
