name: Generate Automated Roblox Short

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, ImageMagick & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation

      - name: Modify ImageMagick Security Policy for MoviePy
        run: |
          sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="memory" value="256MiB"/name="memory" value="2GiB"/' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/name="disk" value="1GiB"/name="disk" value="4GiB"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python main.py

      - name: Commit and Push Story and Character Memory
        run: |
          git config --global user.name "Story Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add story_memory.txt character_bible.json
          git commit -m "Auto-update story and character memory for next episode" || echo "No changes to commit"
          git push
